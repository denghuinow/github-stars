name: Update GitHub Stars

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_stars.py"
      - "scripts/patch_update_stars.py"
      - "scripts/compact_markdown.py"
      - "overrides.json"
      - ".github/workflows/update-stars.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update stars index
        env:
          GITHUB_STAR_USER: denghuinow
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          python scripts/patch_update_stars.py
          python scripts/update_stars.py
          python scripts/compact_markdown.py

      - name: Commit changes
        run: |
          if git diff --quiet README.md data categories; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data categories
          git commit -m "chore: refresh starred repositories"
          git push
